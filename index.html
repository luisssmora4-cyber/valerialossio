<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>COEV Design — Acceso Privado</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C2230'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-size='30' fill='%23F5F3EF' letter-spacing='1'%3EVL%3C/text%3E%3C/svg%3E" />
<style>
@font-face { font-family: 'Bodoni Moda'; font-weight: 500; src: url('assets/fonts/bodoni_moda_5.ttf') format('truetype'); }
@font-face { font-family: 'Pinyon Script'; font-weight: 400; src: url('assets/fonts/pinyon_script_1.ttf') format('truetype'); }
@font-face { font-family: 'Montserrat'; font-weight: 300; src: url('assets/fonts/montserrat_4.ttf') format('truetype'); }
@font-face { font-family: 'Montserrat'; font-weight: 500; src: url('assets/fonts/montserrat_6.ttf') format('truetype'); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100dvh;
  background: radial-gradient(circle at 22% 18%, #262E3F 0%, #171C27 52%, #11141C 100%);
  color: #F5F3EF;
  font-family: 'Montserrat', sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px;
  -webkit-font-smoothing: antialiased;
}
.card {
  width: 100%;
  max-width: 520px;
  padding: 52px 42px;
  border: 1px solid rgba(164, 188, 200, 0.18);
  background: rgba(20, 24, 34, 0.68);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  text-align: center;
  border-radius: 6px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
}
.logo { height: 28px; width: auto; opacity: 0.85; margin-bottom: 28px; }
.script { font-family: 'Pinyon Script', cursive; font-size: 56px; color: #A4BCC8; line-height: 0.85; }
.serif { font-family: 'Bodoni Moda', serif; font-size: 32px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 8px; }
.rule { width: 48px; height: 1.5px; background: #833945; margin: 24px auto; }
.desc { font-size: 13.5px; font-weight: 300; line-height: 1.85; color: rgba(245, 243, 239, 0.72); }
.foot { margin-top: 32px; font-size: 9.5px; letter-spacing: 0.28em; text-transform: uppercase; color: rgba(164, 188, 200, 0.56); }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logos/coev_white.png" alt="COEV Design" />
    <div class="script">Acceso</div>
    <div class="serif">Privado</div>
    <div class="rule"></div>
    <p class="desc">
      Este proyecto se encuentra actualmente en fase de revisión privada.<br/>
      Utiliza el enlace personal de vista previa proporcionado por <strong>COEV Design</strong>.
    </p>
    <div class="foot">COEV Design &nbsp;·&nbsp; Editorial &amp; Digital Studio</div>
  </main>
</body>
</html>
